apiVersion: v1
kind: Service
metadata:
  name: {{ include "comms-b2c-ui.fullname" . }}
  labels:
    {{- include "comms-b2c-ui.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
  selector:
    {{- include "comms-b2c-ui.selectorLabels" . | nindent 4 }}
