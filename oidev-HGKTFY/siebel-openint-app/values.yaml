replicaCount: 1
image:
  siebel_open_integration:
    registry: phx.ocir.io
    repository: siebeldev/cm/siebel_openint
    tag: latest
    imagePullPolicy: Always

imagePullSecrets:
  - ocirsecret
  - customsecret

siebelCerts:
  secretName: siebel-certs
  siebel_server_keystore_file_name: siebelserverkeystore.jks
  siebel_client_keystore_file_name: siebelclientkeystore.jks
  siebel_truststore_file_name: siebeltruststore.jks

service:
  type: NodePort
  port: 8433
  # nodePort: 30443  # Optional: Only used if type is NodePort

resources:
    limits:
      cpu: "1"
      memory: 8Gi
    requests:
      cpu: "0.5"
      memory: 2Gi

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

coherence:
  enable: true
  clusterName: siebelcache
  clusterWKA: siebelcache-wka.coherence-server.svc
  wkaEndpoint: coherence-nodeport.coherence-server.svc.cluster.local

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
