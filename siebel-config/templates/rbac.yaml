---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: list-svc-sa
  namespace: {{ .Release.Namespace }}
  labels: {{- include "siebel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: list-svc-role
  namespace: {{ .Release.Namespace }}
  labels: {{- include "siebel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - services
      - endpoints
      - pods
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: list-svc-rolebind
  namespace: {{ .Release.Namespace }}
  labels: {{- include "siebel.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: list-svc-sa
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: list-svc-role
  apiGroup: rbac.authorization.k8s.io