migration:
  AIService: quantum
  MigrationDeployment:
    migration_deployment_info:
    - DeploymentInfo:
        Action: Deploy
        PhysicalHostIP: quantum-0.siebel.svc.cluster.local:4430
        ProfileName: SiebelMigration
      MigrationDeployParams:
        MigrationDesc: Siebel Migration App
        SiebelMigration: migration-app
  MigrationProfiles:
    profiles:
    - MigrationConfigParams:
        AuthenticationType: Basic
        Language: enu
        LogLevel: Error
        PackageLocation: /migration
        SiebelApplicationName: eai
        SiebelRESTEndpoint: https://quantum-0.siebel.svc.cluster.local:4430/siebel/v1.0
        SleepTime: 15
        Timeout: 300
      Profile:
        ProfileName: SiebelMigration
