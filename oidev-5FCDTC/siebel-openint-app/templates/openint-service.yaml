apiVersion: v1
kind: Service
metadata:
  name: openint-service
spec:
  type: {{ .Values.service.type }}
  selector:
    app: siebel-open-integration
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: 8433
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}